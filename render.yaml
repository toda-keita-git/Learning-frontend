services:
  - type: web
    name: learning-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
      - key: VITE_CALLBACK_URL
        sync: false
      - key: VITE_REPO_OWNER
        sync: false
      - key: VITE_REPO_NAME
        sync: false
      - key: VITE_BACKEND_TOKEN_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
