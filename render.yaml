services:
  - type: web
    name: learning-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # index.html・サービスワーカー関連ファイルはURLにハッシュが付かず常に同じ名前のため、
    # デフォルトのキャッシュ設定のままだとCDN/ブラウザに長期間キャッシュされ、
    # デプロイしても更新が反映されないことがある。これらは常に最新を取りに行くようにする
    # （JS/CSSなどのビルド成果物はファイル名にハッシュが付くため、そちらは対象外でよい）
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /notification-sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
      - key: VITE_CALLBACK_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CALLBACK_URL
        sync: false
      # Google Picker API用のAPIキー。OAuthクライアントID/シークレットとは別物。
      # Google Cloud Consoleで「Google Picker API」を有効化し、HTTPリファラーを
      # このアプリのドメインに制限したAPIキーを作成して設定する
      - key: VITE_GOOGLE_PICKER_API_KEY
        sync: false
      # drive.fileスコープでPickerを使う場合はsetAppId()が必須。値はGoogle Cloud
      # ConsoleのIAMと管理 > 設定に表示される「プロジェクト番号」（プロジェクトID
      # ではない）。VITE_GOOGLE_CLIENT_IDと同じCloudプロジェクトのものを使うこと
      - key: VITE_GOOGLE_PROJECT_NUMBER
        sync: false
      - key: VITE_REPO_OWNER
        sync: false
      - key: VITE_REPO_NAME
        sync: false
      - key: VITE_BACKEND_TOKEN_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
